services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flightbooking
      MYSQL_USER: flightapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the .env file}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/flightbooking
      SPRING_DATASOURCE_USERNAME: flightapp
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  db-data: